<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HanifTalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { transition: all 0.3s ease; z-index: 100; }
        body.modal-active { overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Smooth Scroll untuk konten cerita */
        .story-content { -webkit-overflow-scrolling: touch; }
        .story-content b, .story-content strong { font-weight: bold; }
        .story-content i, .story-content em { font-style: italic; }
        
        /* Animasi Modal Mobile (Slide Up) */
        @media (max-width: 768px) {
            .modal-content {
                transform: translateY(100%);
                transition: transform 0.3s ease-out;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
            }
            .modal:not(.opacity-0) .modal-content {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-indigo-600 tracking-tight">Ceritaku</h1>
            <div class="flex space-x-5">
                <a href="index.html" class="text-sm md:text-base text-gray-500 font-medium">Home</a>
                <a href="profile.html" class="text-sm md:text-base text-indigo-600 font-bold border-b-2 border-indigo-600">Profile</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6 max-w-5xl">
        <header class="bg-white p-6 md:p-8 rounded-3xl shadow-sm text-center mb-8 border border-gray-100 relative">
            <button onclick="toggleBioModal()" class="absolute top-4 right-4 p-2 bg-indigo-50 text-indigo-600 rounded-full active:scale-95 transition-transform shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                </svg>
            </button>

            <div class="relative w-24 h-24 md:w-32 md:h-32 mx-auto mb-4">
                <img id="displayAvatar" src="" alt="Avatar" class="w-full h-full object-cover rounded-full border-4 border-indigo-50 shadow-md">
            </div>
            
            <h2 id="displayName" class="text-2xl md:text-3xl font-extrabold text-gray-800"></h2>
            <p id="displayBio" class="text-sm md:text-base text-gray-500 max-w-lg mx-auto mt-2 leading-relaxed px-2"></p>
            
            <div class="mt-6 flex justify-center border-t pt-4 border-gray-50">
                <div class="px-6">
                    <span id="storyCount" class="block font-black text-xl text-indigo-600">0</span>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Karya</span>
                </div>
            </div>
        </header>

        <h3 class="text-lg md:text-2xl font-bold mb-4 text-gray-800 flex items-center gap-2 px-1">
            📖 Koleksi Cerita
        </h3>
        
        <div id="myStories" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <div id="bioModal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-end md:items-center justify-center z-[100]">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="toggleBioModal()"></div>
        <div class="modal-content bg-white w-full md:max-w-md mx-auto rounded-t-3xl md:rounded-3xl shadow-2xl z-50 p-6 md:p-8 relative">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 md:hidden"></div> <div class="flex justify-between items-center mb-6">
                <p class="text-lg font-bold">Edit Profil</p>
                <button onclick="toggleBioModal()" class="text-gray-400 p-2 text-xl">✕</button>
            </div>
            <div class="space-y-4">
                <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-2xl">
                    <img id="tempAvatarPreview" src="" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm">
                    <input type="file" id="inputAvatar" accept="image/*" class="text-xs w-full overflow-hidden text-gray-400">
                </div>
                <input type="text" id="inputName" placeholder="Nama Pena" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 border-none">
                <textarea id="inputBio" placeholder="Bio singkat..." rows="3" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 border-none"></textarea>
            </div>
            <button onclick="saveProfile()" class="w-full mt-6 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 active:scale-95 transition-all">Simpan Perubahan</button>
        </div>
    </div>

    <div id="readModal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-[110]">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeReadModal()"></div>
        <div class="modal-content bg-white w-full h-full md:h-auto md:w-11/12 md:max-w-2xl md:rounded-3xl shadow-2xl z-50 flex flex-col relative overflow-hidden">
            <div class="p-4 md:p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <h3 id="readTitle" class="font-black text-gray-800 line-clamp-1 pr-4"></h3>
                <button onclick="closeReadModal()" class="bg-gray-100 text-gray-500 rounded-full p-2 hover:bg-red-50 hover:text-red-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 md:p-8">
                <img id="readImage" src="" class="w-full h-48 md:h-64 object-cover rounded-2xl mb-6 shadow-sm">
                <div id="readDate" class="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.2em] mb-4"></div>
                <div id="readContent" class="story-content text-base md:text-lg text-gray-700 leading-relaxed pb-10">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Logika JavaScript tetap sama seperti sebelumnya, hanya ditambahkan sedikit handling untuk UI
        const stories = JSON.parse(localStorage.getItem('stories')) || [];
        const myStoriesContainer = document.getElementById('myStories');
        
        let authorProfile = JSON.parse(localStorage.getItem('authorProfile')) || {
            name: "Penulis Hebat",
            bio: "Menulis adalah cara terbaik untuk mengabadikan momen.",
            avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
        };

        function renderProfile() {
            document.getElementById('displayName').innerText = authorProfile.name;
            document.getElementById('displayBio').innerText = authorProfile.bio;
            document.getElementById('displayAvatar').src = authorProfile.avatar;
            document.getElementById('tempAvatarPreview').src = authorProfile.avatar;
            document.getElementById('inputName').value = authorProfile.name;
            document.getElementById('inputBio').value = authorProfile.bio;
        }

        function toggleBioModal() {
            document.getElementById('bioModal').classList.toggle('opacity-0');
            document.getElementById('bioModal').classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function openReadModal(index) {
            const story = stories[index];
            document.getElementById('readTitle').innerText = story.title;
            document.getElementById('readImage').src = story.image;
            document.getElementById('readDate').innerText = story.date;
            document.getElementById('readContent').innerHTML = story.content;
            
            document.getElementById('readModal').classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeReadModal() {
            document.getElementById('readModal').classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        document.getElementById('inputAvatar').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('tempAvatarPreview').src = e.target.result;
                reader.readAsDataURL(file);
            }
        });

        function saveProfile() {
            authorProfile.name = document.getElementById('inputName').value;
            authorProfile.bio = document.getElementById('inputBio').value;
            authorProfile.avatar = document.getElementById('tempAvatarPreview').src;
            localStorage.setItem('authorProfile', JSON.stringify(authorProfile));
            renderProfile();
            toggleBioModal();
        }

        document.getElementById('storyCount').innerText = stories.length;
        if(stories.length === 0) {
            myStoriesContainer.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 italic bg-white rounded-3xl border border-dashed">Belum ada karya.</div>`;
        } else {
            stories.forEach((story, index) => {
                myStoriesContainer.innerHTML += `
                    <div onclick="openReadModal(${index})" class="flex bg-white p-4 rounded-2xl shadow-sm border border-gray-100 items-center gap-4 active:bg-gray-50 transition-all">
                        <img src="${story.image}" class="w-20 h-20 object-cover rounded-xl shadow-sm">
                        <div class="flex-1 overflow-hidden">
                            <h4 class="font-bold text-gray-800 truncate">${story.title}</h4>
                            <p class="text-[10px] font-bold text-indigo-400 uppercase mt-0.5">${story.date}</p>
                            <div class="text-xs text-gray-400 mt-1 line-clamp-2 italic leading-tight">
                                ${story.content.replace(/<[^>]*>?/gm, '').substring(0, 50)}...
                            </div>
                        </div>
                        <div class="text-indigo-300 pr-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                `;
            });
        }

        renderProfile();
    </script>
</body>
</html>
