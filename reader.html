<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HanifTalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { transition: all 0.3s ease; z-index: 100; }
        body.modal-active { overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .story-content { -webkit-overflow-scrolling: touch; }
        .story-content b, .story-content strong { font-weight: bold; }
        .story-content i, .story-content em { font-style: italic; }
        
        /* Animasi Modal Reader Fullscreen */
        @media (max-width: 768px) {
            .modal-content {
                transform: translateY(100%);
                transition: transform 0.3s ease-out;
            }
            .modal:not(.opacity-0) .modal-content {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm p-4 sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto text-center">
            <h1 class="text-xl font-bold text-indigo-600 tracking-tight">Hanif Talk</h1>
            <h1 class="text-gray-500 text-sm font-medium">Reader Mode</h1>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-12">
            <div class="relative w-28 h-28 mx-auto mb-4">
                <img id="viewAvatar" src="" alt="Penulis" class="w-full h-full object-cover rounded-full border-4 border-white shadow-xl">
            </div>
            <h2 id="viewName" class="text-3xl font-black text-gray-800 tracking-tight"></h2>
            <p id="viewBio" class="text-gray-500 mt-3 leading-relaxed max-w-lg mx-auto italic"></p>
            
            <div class="mt-6 inline-flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold uppercase tracking-widest">
                <span id="storyCount">0</span> Karya Diterbitkan
            </div>
        </header>

        <div class="h-px bg-gray-200 w-full mb-10"></div>

        <div id="readerStories" class="grid grid-cols-1 gap-6">
            </div>
    </main>

    <div id="readModal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-[110]">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeReadModal()"></div>
        <div class="modal-content bg-white w-full h-full md:h-[90vh] md:w-11/12 md:max-w-2xl md:rounded-3xl shadow-2xl z-50 flex flex-col relative overflow-hidden">
            
            <div class="p-4 md:p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <button onclick="closeReadModal()" class="flex items-center gap-2 text-gray-500 font-bold text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Kembali
                </button>
                <div class="w-10"></div> </div>
            
            <div class="flex-1 overflow-y-auto p-6 md:p-10 bg-white">
                <img id="readImage" src="" class="w-full h-56 md:h-80 object-cover rounded-3xl mb-8 shadow-lg">
                <h2 id="readTitle" class="text-3xl font-black text-gray-900 mb-2 leading-tight"></h2>
                <div id="readDate" class="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.3em] mb-8 pb-4 border-b border-gray-50"></div>
                <div id="readContent" class="story-content text-lg text-gray-700 leading-relaxed space-y-4">
                    </div>
                <div class="h-20"></div> </div>
        </div>
    </div>

    <script>
        const stories = JSON.parse(localStorage.getItem('stories')) || [];
        const readerStoriesContainer = document.getElementById('readerStories');
        
        let authorProfile = JSON.parse(localStorage.getItem('authorProfile')) || {
            name: "Penulis Anonim",
            bio: "Selamat datang di ruang ceritaku.",
            avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
        };

        // Render Informasi Penulis
        function initReaderView() {
            document.getElementById('viewName').innerText = authorProfile.name;
            document.getElementById('viewBio').innerText = authorProfile.bio;
            document.getElementById('viewAvatar').src = authorProfile.avatar;
            document.getElementById('storyCount').innerText = stories.length;
            document.title = `Karya ${authorProfile.name} - Ceritaku`;
        }

        function openReadModal(index) {
            const story = stories[index];
            document.getElementById('readTitle').innerText = story.title;
            document.getElementById('readImage').src = story.image;
            document.getElementById('readDate').innerText = story.date;
            document.getElementById('readContent').innerHTML = story.content;
            
            document.getElementById('readModal').classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeReadModal() {
            document.getElementById('readModal').classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // Render List Cerita (Versi Pembaca)
        if(stories.length === 0) {
            readerStoriesContainer.innerHTML = `
                <div class="text-center py-20 bg-white rounded-3xl border border-gray-100 shadow-sm">
                    <p class="text-gray-400">Penulis belum mengunggah cerita apa pun.</p>
                </div>
            `;
        } else {
            stories.forEach((story, index) => {
                readerStoriesContainer.innerHTML += `
                    <div onclick="openReadModal(${index})" class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 hover:shadow-md transition-all active:scale-[0.98] cursor-pointer group">
                        <div class="flex flex-col md:flex-row gap-6">
                            <img src="${story.image}" class="w-full md:w-40 h-40 object-cover rounded-2xl shadow-inner">
                            <div class="flex-1 flex flex-col justify-center">
                                <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2">${story.date}</p>
                                <h4 class="text-2xl font-bold text-gray-800 group-hover:text-indigo-600 transition-colors mb-2">${story.title}</h4>
                                <div class="text-sm text-gray-500 line-clamp-2 italic leading-relaxed">
                                    ${story.content.replace(/<[^>]*>?/gm, '').substring(0, 100)}...
                                </div>
                                <div class="mt-4 flex items-center gap-1 text-indigo-600 text-xs font-black uppercase">
                                    Baca Selengkapnya
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        initReaderView();
    </script>
</body>
</html>
